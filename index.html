<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Space Weather & CME Alert Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        space: { 900: '#030712', 800: '#0B0F19', 700: '#111827', 600: '#1F2937', 500: '#374151' },
                        cyan: { 400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2' },
                        amber: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glow-cyan { box-shadow: 0 0 25px rgba(6, 182, 212, 0.25); }
        .glow-amber { box-shadow: 0 0 25px rgba(245, 158, 11, 0.25); }
        .glow-green { box-shadow: 0 0 25px rgba(34, 197, 94, 0.25); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }
    </style>
</head>
<body class="bg-space-900 text-gray-100 min-h-screen flex flex-col selection:bg-cyan-500 selection:text-black">

    <!-- Header Navigation -->
    <header class="border-b border-gray-800 bg-space-800/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center glow-cyan">
                    <i class="fa-solid fa-satellite text-space-900 text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold tracking-wider text-sm sm:text-base bg-gradient-to-r from-cyan-400 to-blue-400 bg-clip-text text-transparent">NASA DONKI PIPELINE</h1>
                    <p class="text-xs text-gray-400 font-mono">Space Weather Alert System</p>
                </div>
            </div>
            
            <!-- NEW Interactive Tabs -->
            <div class="hidden md:flex items-center bg-space-900 p-1 rounded-lg border border-gray-800 text-xs font-mono">
                <button onclick="switchTab('dashboard')" id="tabDashboard" class="bg-space-700 text-cyan-400 px-4 py-1.5 rounded shadow transition">📊 Dashboard</button>
                <button onclick="switchTab('architecture')" id="tabArchitecture" class="text-gray-400 hover:text-gray-200 px-4 py-1.5 rounded transition">☁️ Architecture</button>
                <button onclick="switchTab('guide')" id="tabGuide" class="text-gray-400 hover:text-gray-200 px-4 py-1.5 rounded transition">📡 Kp Guide</button>
            </div>

            <div class="flex items-center space-x-4">
                <div class="hidden md:flex items-center space-x-2 bg-space-900 px-3 py-1.5 rounded-full border border-gray-800 text-xs font-mono">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                    <span class="text-gray-300">AWS Lambda: Active</span>
                </div>
                <button onclick="openSettingsModal()" class="p-2 rounded-lg bg-space-700 hover:bg-space-600 border border-gray-700 transition text-gray-300 hover:text-white" title="Pipeline Settings">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        
        <!-- TAB 1: LIVE DASHBOARD -->
        <div id="viewDashboard" class="space-y-8 block">
            <!-- Top Status & Health Grid -->
            <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <!-- System Status Card -->
                <div class="bg-space-800 border border-gray-800 rounded-2xl p-5 relative overflow-hidden group hover:border-cyan-500/50 transition">
                    <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition text-cyan-400">
                        <i class="fa-solid fa-microchip text-4xl"></i>
                    </div>
                    <p class="text-xs font-mono text-gray-400 uppercase tracking-wider">Pipeline Engine</p>
                    <div class="flex items-baseline space-x-2 mt-2">
                        <span class="text-2xl font-bold font-mono text-cyan-400">AWS Lambda</span>
                        <span class="text-xs text-green-400 font-mono bg-green-950/50 px-2 py-0.5 rounded border border-green-800/50">Online</span>
                    </div>
                    <div class="mt-4 flex items-center justify-between text-xs text-gray-400 font-mono border-t border-gray-700/50 pt-3">
                        <span>Container ECR:</span>
                        <span class="text-gray-200">space-weather-repo</span>
                    </div>
                </div>

                <!-- Automation Trigger Card -->
                <div class="bg-space-800 border border-gray-800 rounded-2xl p-5 relative overflow-hidden group hover:border-amber-500/50 transition">
                    <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition text-amber-400">
                        <i class="fa-solid fa-clock text-4xl"></i>
                    </div>
                    <p class="text-xs font-mono text-gray-400 uppercase tracking-wider">EventBridge Schedule</p>
                    <div class="flex items-baseline space-x-2 mt-2">
                        <span class="text-2xl font-bold font-mono text-amber-400">rate(1 day)</span>
                        <span class="text-xs text-amber-400 font-mono bg-amber-950/50 px-2 py-0.5 rounded border border-amber-800/50">Scheduled</span>
                    </div>
                    <div class="mt-4 flex items-center justify-between text-xs text-gray-400 font-mono border-t border-gray-700/50 pt-3">
                        <span>Next execution:</span>
                        <span id="next-exec-timer" class="text-gray-200">23h 41m left</span>
                    </div>
                </div>

                <!-- CME Events Count -->
                <div class="bg-space-800 border border-gray-800 rounded-2xl p-5 relative overflow-hidden group hover:border-cyan-500/50 transition">
                    <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition text-cyan-400">
                        <i class="fa-solid fa-sun text-4xl"></i>
                    </div>
                    <p class="text-xs font-mono text-gray-400 uppercase tracking-wider">CME Events (30d)</p>
                    <div class="flex items-baseline space-x-2 mt-2">
                        <span id="cme-count-badge" class="text-2xl font-bold font-mono text-cyan-400">--</span>
                        <span class="text-xs text-gray-400 font-mono">Recorded</span>
                    </div>
                    <div class="mt-4 flex items-center justify-between text-xs text-gray-400 font-mono border-t border-gray-700/50 pt-3">
                        <span>Data Source:</span>
                        <span class="text-cyan-400 font-mono">NASA DONKI API</span>
                    </div>
                </div>

                <!-- GST Events Count -->
                <div class="bg-space-800 border border-gray-800 rounded-2xl p-5 relative overflow-hidden group hover:border-amber-500/50 transition">
                    <div class="absolute
